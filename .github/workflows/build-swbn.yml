name: Build Standalone .swbn (Isolated Web App)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publicar dist/webblox.swbn en GitHub Releases"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-swbn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch and extract Roblox WebClientApp engine
        run: bun run fetch:webblox

      - name: Build Scramjet proxy assets
        run: bun run build:proxy

      - name: Build and sign webblox.swbn
        env:
          IWA_SIGNING_KEY: ${{ secrets.IWA_SIGNING_KEY }}
          SWBN_VERSION: "1.0.${{ github.run_number }}"
          IWA_UPDATE_MANIFEST_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main/swbn/update-manifest.json"
        run: bun run build:swbn

      - name: Upload webblox.swbn artifact
        uses: actions/upload-artifact@v4
        with:
          name: webblox-swbn
          path: swbn/dist/webblox.swbn
          retention-days: 14

      - name: Publish GitHub Release & update update-manifest.json
        if: ${{ inputs.create_release != false }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: "1.0.${{ github.run_number }}"
          REPO: ${{ github.repository }}
        run: |
          TAG="iwa-v${VERSION}"
          export SRC="https://github.com/${REPO}/releases/download/${TAG}/webblox.swbn"

          node -e '
            const fs = require("node:fs");
            const file = "swbn/update-manifest.json";
            let data = { versions: [] };
            try { data = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
            if (!Array.isArray(data.versions)) data.versions = [];
            data.versions = data.versions.filter((v) => v && v.version !== process.env.VERSION);
            data.versions.push({ version: process.env.VERSION, src: process.env.SRC });
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          '

          gh release create "$TAG" swbn/dist/webblox.swbn swbn/update-manifest.json \
            --latest \
            --title "Webblox IWA $TAG" \
            --notes "Paquete autónomo .swbn para Chrome con Direct Sockets (sin backend externo) y actualización automática vía update-manifest.json."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swbn/update-manifest.json
          git commit -m "chore(swbn): actualizar update-manifest.json a ${VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin main

