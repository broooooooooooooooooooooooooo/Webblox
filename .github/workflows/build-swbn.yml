name: Build Standalone .swbn (Isolated Web App)

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publicar dist/webblox.swbn en GitHub Releases"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-swbn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch and extract Roblox WebClientApp engine
        run: bun run fetch:webblox

      - name: Build Scramjet proxy assets
        run: bun run build:proxy

      - name: Build and sign webblox.swbn
        env:
          IWA_SIGNING_KEY: ${{ secrets.IWA_SIGNING_KEY }}
          SWBN_VERSION: "1.0.${{ github.run_number }}"
        run: bun run build:swbn

      - name: Upload webblox.swbn artifact
        uses: actions/upload-artifact@v4
        with:
          name: webblox-swbn
          path: swbn/dist/webblox.swbn
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.create_release != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="iwa-v1.0.${{ github.run_number }}"
          gh release create "$TAG" swbn/dist/webblox.swbn \
            --title "Webblox IWA $TAG" \
            --notes "Paquete autónomo .swbn para Chrome con Direct Sockets (sin backend externo)."
